name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (AUD-08): the only GitHub resource this workflow touches is
# the repository itself — `actions/checkout` fetches the commit, and every other
# step is a local command (npm, tsc, eslint, pytest, next build). Without this
# key the GITHUB_TOKEN inherits the repository default, which can be read/write
# on older repositories: the job would then be able to push commits, comment on
# pull requests or publish packages it never needs. `contents: read` is the
# complete requirement; the cache used by setup-node/setup-uv is served through
# the Actions runtime token and needs no scope here. Enforced by
# src/lib/workflow-permissions.test.ts.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # `npm run test:py` shells out to `uv` (see ai-service/pyproject.toml and
      # ai-service/uv.lock). The action also provisions the Python 3.12
      # interpreter pinned by ai-service/.python-version.
      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint via Next.js)
        run: npm run lint

      - name: Unit tests (TypeScript)
        run: npm test

      - name: Unit tests (Python, FastAPI service)
        run: npm run test:py

      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Playwright browsers are not installed by npm ci; ship them explicitly.
      # `--with-deps` installs the OS libraries the browsers need on ubuntu-latest.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Single build: the job builds once here, and PLAYWRIGHT_SKIP_BUILD=1
      # makes the playwright webServer start the already-built app instead of
      # rebuilding (see playwright.config.ts and npm run test:e2e:ci).
      - name: Production build
        run: npm run build

      # No AI service is needed: the chat routes fail closed with a controlled
      # 503 when the service is absent, and the E2E specs exercise the UI
      # against mocked /api/chat handlers or that controlled failure.
      - name: Run Playwright tests
        run: npm run test:e2e:ci
