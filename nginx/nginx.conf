server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Do not disclose Nginx version in the Server response header or error pages
    server_tokens off;

    # Dedicated proxy health endpoint (independent of upstream frontend)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Gzip compression for static assets and API responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Maximum request body size for JSON payloads
    client_max_body_size 2M;

    # ============================================================
    # CLIENT IP TRUST BOUNDARY
    # ============================================================
    # Overwrite X-Forwarded-For and X-Real-IP with the verified TCP socket address ($remote_addr).
    # Completely replaces any incoming client-supplied values.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Explicitly strip client-controlled headers to prevent proxy header pollution
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Cluster-Client-IP "";

    # HTTP/1.1 and streaming/WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forward all traffic to the internal frontend service
    location / {
        proxy_pass http://frontend:3000;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
