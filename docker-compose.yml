services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      - ./src/data/rag-index.json:/app/rag-index.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      ai-service:
        condition: service_healthy
    env_file:
      - ./.env.local
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    restart: unless-stopped
